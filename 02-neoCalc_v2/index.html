<!DOCTYPE html>

<html lang="pt-BR">
	
<head>
	<meta charset="UTF-8">
	<title>NeoCalc</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="author" content="Isaque Nogueira">
	<meta name="description" content="">
	<link rel="stylesheet" href="css/style.css">
	<link rel="icon" href="source/icon.png">
	<script src="js/main.js" type="module"></script>
</head>

<body>

 <!-- container principal -->
 <div id="baseContainer">
	<!-- neoCalc -->
	<main id="mainContainer">
		<form id="neoCalc">
		 <!-- header -->
		 <header id="header">
		
			<!-- title -->
			<div id="headerTop">
			  <h1 id="title">NeoCalc</h1>
			  <div id="containerSpecialButtons">
			  	<button class="special button mathButtons" disabled>F</button>
		 	  	<button class="special button mathButtons" disabled>D</button>
		 	   </div>
			</div>
			
			<!-- display -->
			<div id="displayContainer">
			 	<input type="text" id="displayInput" readonly value="">
			 	<canvas id="canvas" class="hidden"></canvas>
			</div>
		  </header>


		  <!-- button collections -->
		 <div id="containerButtons">
		 	<!-- line 1 -->
		 	<div class="lineButton">
				<button class="button" id="clearButton" type="button" data-value="c">C</button>	 		
				<button class="button" type="button" data-value="<"><</button>
				<button class="button" type="button" data-value="d">
					<img src="source/calc/dino_icon1.png" id="dinoIcon" width="37%">
				</button>
				<button class="button mathButtons" type="button" data-value="+">+</button>
			</div>
		 	<!-- line 2 -->
			<div class="lineButton">
				<button class="button" type="button" data-value="7">7</button>
				<button class="button" type="button" data-value="8">8</button>
				<button class="button" type="button" data-value="9">9</button>
				<button class="button mathButtons" type="button" data-value="-">-</button>
			</div>
		 	<!-- line 3 -->
		 	<div class="lineButton">
				<button class="button" type="button" data-value="4">4</button>
				<button class="button" type="button" data-value="5">5</button>
				<button class="button" type="button" data-value="6">6</button>
				<button class="button mathButtons" type="button" data-value="*">x</button>
			</div>
		 	<!-- line 4 -->
		 	<div class="lineButton">
				<button class="button" type="button" data-value="1">1</button>
				<button class="button" type="button" data-value="2">2</button>
				<button class="button" type="button" data-value="3">3</button>
				<button class="button mathButtons" type="button" data-value="/">/</button>
			</div>
		 	<!-- line 5 -->
		 	<div class="lineButton">
				<button class="button" type="button" data-value=".">.</button>
				<button class="button" type="button" data-value="0">0</button>
				<button class="button mathButtons" id="calcButton" type="button" data-value="=">=</button>
			</div>
		 </div>	
		</form>
	</main>

 </div>
	
</body>

</html>
